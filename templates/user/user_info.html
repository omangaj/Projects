{% extends 'master.html' %}
{% load cart_tag %}
{% block body %}
{% if user.is_authenticated %}
<div class="container">
    <div class="row">
        <form  method="post" >
            {% csrf_token %}
            <div class="col-sm-12">
                <div class="order-form">
                    <h2 class="title text-center">User Details</h2>
                    <div class="status alert alert-success" style="display: none"></div>
                        <div class="form-group col-md-6">
                            <input type="text" name="name" class="form-control" required="required"  value="{{user.first_name}}" readonly>
                        </div>
                        <div class="form-group col-md-6">
                            <input type="text" name="surname" class="form-control" required="required"  value="{{user.last_name}}" readonly>
                        </div>
                        <div class="form-group col-md-6">
                           <input type="text" name="username" class="form-control" required="required" value="{{user.username}}" readonly>
                        </div>
                        <div class="form-group col-md-6">
                            <input type="email" name="email" class="form-control" required="required" value="{{user.email}}" readonly>
                        </div>
                        <div class="form-group col-md-12">
                            <textarea name="address" required="required" class="form-control" placeholder="Address"></textarea>
                        </div>
                        <div class="form-group col-md-6">
                            <input type="number" name="mobile" class="form-control" required="required" placeholder="Mobile">
                        </div>
                        <div class="form-group col-md-6">
                            <input type="text" name="city" class="form-control" required="required" placeholder="City/village">
                        </div>
                        <div class="form-group col-md-6">
                            <input type="text" name="sub_district" class="form-control" required="required" placeholder="Sub-district">
                        </div>
                        <div class="form-group col-md-6">
                            <input type="text" name="district" class="form-control" required="required" placeholder="District">
                        </div>
                        <div class="form-group col-md-6">
                            <input type="text" name="state" class="form-control" required="required" placeholder="State">
                        </div>
                        <div class="form-group col-md-6">
                            <input type="number" name="pincode" class="form-control" required="required" placeholder="Pincode">
                        </div>
                </div>
                <div class="form-group col-md-12">
                <a href="{% url 'index' %}"><input type="submit" name="submit"  class="btn btn-primary pull-right" value="Submit"></a>
            </div>
            </div>
        </form>
    </div>
</div>
{% endif %}
{% endblock %}
