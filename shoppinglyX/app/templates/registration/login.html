{% extends 'app/base.html' %}
{% block title %}Login{% endblock title %}
{% load static %}
{% block body %}
<section id="form" class="login_form"><!--form-->
		<div class="container col-sm-8 col-sm-offset-1">
			<div class="">
				<div class="signup-form"><!--registration form-->
					<h2>Log in to account</h2>
					<form method="post" >
						{% csrf_token %}
						{% for field in form %}
							{{ field.errors }}
							<label style="">{{field.label_tag}}</label>
							<p style="color:red">{{ field }}</p>
						{% endfor %}
						<a href="{% url 'password_reset' %}" style="float:right;">Forgot Password </a><br>
						<button class="btn btn-default" type="submit">Log In</button><br>
						<span style="text-align: center;">Create New Account&nbsp;&rarr;&nbsp;</span><a href="{% url 'signup' %}">signup</a>
					</form>
				</div><!--registration form-->
			</div>
		</div>
</section>
{% endblock %}
