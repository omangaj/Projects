{% extends 'app/base.html' %}
{% block title %}Password reset form{% endblock title %}
{% load static %}
{% block body %}
<section id="form"  class="reset_form"><!--form-->
		<div class="container col-sm-6 col-sm-offset-1">
			<div class="">
				<div class="signup-form"><!--registration form-->
					<h2>Reset Password</h2>
					<form method="post" >
						{% csrf_token %}
						{% for field in form %}
							{{ field.errors }}
							<label>{{field.label_tag}}</label>
							<p>{{ field }}</p>
						{% endfor %}
						<button class="btn btn-default" type="submit">send Confirmation Link</button><br>

					</form>
				</div><!--registration form-->
			</div>
		</div>
</section>
{% endblock %}
